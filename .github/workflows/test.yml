## CI: runs the committed test tier on Linux, macOS and Windows.
##
## Windows is in the matrix because it is the only platform where the parallel
## backend differs: there is no fork(), so sge_lapply() takes its PSOCK path
## (R/utils_parallel.R). That path can be exercised anywhere with
## options(spatialGE.psock=TRUE) and is, in tests/testthat/test-utils_parallel.R --
## but Windows path handling, and the shell that the inline
## system(sprintf('echo ...')) worker progress messages invoke, can only be
## verified on Windows itself.
##
## Golden-baseline comparisons are deliberately NOT run here. They are bit-exact
## (waldo tolerance = NULL) and the pipeline reaches BLAS/LAPACK through prcomp,
## loess, gstat, spaMM and uwot, so results differ in the low bits across BLAS
## implementations. tests/golden/ is captured locally, is gitignored, and the gate
## is a same-machine/same-toolchain tool -- see the header of
## dev/baseline/compare_baseline.R. The platform-portable net is the
## tests/testthat/test-numeric-*.R tier, which asserts literal values at explicit
## tolerances and runs by default.

on:
  push:
    branches: [main, alex-refactor]
  pull_request:
    branches: [main, alex-refactor]

name: test

jobs:
  test:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: '4.5.3'}
          - {os: macos-latest,   r: '4.5.3'}
          - {os: windows-latest, r: '4.5.3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::devtools, any::testthat, any::writexl, any::withr
          cache: always

      - name: Test
        run: devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      # Runs the whole suite a second time with every parallelized call site
      # forced onto the non-forking backend. On Windows that is already the
      # default, so this step matters on Linux and macOS: it is what stops a
      # fork-only assumption from creeping back in unnoticed between Windows runs.
      - name: Test (non-forking backend)
        run: |
          options(spatialGE.psock = TRUE)
          devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      # Three of the four vignettes are in .Rbuildignore, so R CMD check never
      # builds them and devtools::test() never reads them: a chunk calling an
      # exported function with an argument that no longer exists can sit there
      # indefinitely. This parses every vignette's code and validates argument
      # names against the formals, without evaluating anything.
      - name: Vignette argument check
        run: Rscript dev/ci/check_vignette_args.R

      # roxygen2 8.x silently DROPS importFrom(methods,.hasSlot) when it
      # regenerates NAMESPACE, even though .hasSlot is exported from methods and
      # is used in R/stlist_readers.R (image handling). Regenerating docs with a
      # newer roxygen therefore removes the import and breaks that path at
      # runtime, with no error until a sample with images is read. Guard it.
      - name: NAMESPACE import guard
        # Asks R's own namespace parser instead of grepping. The previous version
        # matched the literal line `importFrom(methods,.hasSlot)` that roxygen2 7
        # wrote; roxygen2 8 writes multi-symbol imports one symbol per line, so
        # the grep began failing on a NAMESPACE that was in fact correct.
        run: |
          Rscript -e 'nd <- parseNamespaceFile("spatialGE", "..", mustExist = TRUE);
            ok <- any(vapply(nd$imports, function(i)
              is.list(i) && identical(i[[1]], "methods") && ".hasSlot" %in% i[[2]],
              logical(1)));
            if (!ok) stop("NAMESPACE no longer imports methods::.hasSlot. R/stlist_readers.R calls it on a Seurat image slot; that call is conditional, so the import can be dropped with no other symptom.")'
        shell: bash

  ## The `test` job above installs Imports only, which is deliberate: the committed
  ## tier must pass without any Suggests. The side effect is that anything gated by
  ## skip_if_not_installed() passes *by not running*. Today that is the whole of
  ## tests/testthat/test-seurat-interop.R -- i.e. as_Seurat() and Seurat v5 input,
  ## the headline features added in 2.0.0 -- so this job installs the Suggests and
  ## fails if those tests skip.
  test-full-suggests:
    runs-on: ubuntu-latest
    name: full Suggests (interop must not skip)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::devtools, any::testthat
          cache: always

      - name: Test with Suggests installed, asserting nothing skipped
        run: |
          res <- as.data.frame(devtools::test(reporter = "silent", stop_on_failure = FALSE))
          interop <- res[grepl("seurat-interop", res$file), , drop = FALSE]
          if (nrow(interop) == 0) {
            stop("test-seurat-interop.R did not run at all.")
          }
          if (sum(interop$skipped) > 0) {
            stop("test-seurat-interop.R skipped ", sum(interop$skipped),
                 " test(s). SeuratObject is a Suggests and must be installed here so that",
                 " as_Seurat()/Seurat v5 input is actually exercised.")
          }
          if (sum(res$failed) > 0 || sum(res$error) > 0) {
            stop("Test failures: ", sum(res$failed), " failed, ", sum(res$error), " errored.")
          }
          cat("interop tests run:", nrow(interop),
              "| suite expectations passed:", sum(res$passed), "\n")
        shell: Rscript {0}

  ## devtools::test() never looks at NAMESPACE, roxygen/usage consistency, examples,
  ## or S4 registration -- so a broken @export, a stale .Rd, or an example that no
  ## longer runs all pass CI today. R CMD check covers those.
  ##
  ## error-on is "error" rather than "warning"/"note" on purpose: the repo has not
  ## been checked here before, so this job first establishes a baseline and fails on
  ## hard breakage (unloadable package, failing examples). Tighten it to "warning"
  ## once the existing NOTEs are cleared.
  check:
    runs-on: ubuntu-latest
    name: R CMD check --as-cran

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"error"'
          upload-snapshots: true
